[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-llmnetops"
version = "0.1.0"
description = "MCP server for read-only network device operations (MikroTik, Cisco, Juniper, Aruba, Huawei, Ruckus)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "network", "netops", "mikrotik", "cisco", "juniper", "aruba", "huawei", "ruckus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]
dependencies = [
    "fastmcp>=2.10",
    "asyncssh>=2.14",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mcp-llmnetops = "mcp_llmnetops.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_llmnetops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]